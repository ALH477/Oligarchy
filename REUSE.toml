# Copyright and licence for every file that does not carry a complete SPDX
# header of its own (REUSE Specification 3.3). `reuse lint` checks the whole
# tree against this file and LICENSES/; .github/workflows/eval.yml runs it.
#
# Precedence is "closest" unless a block says otherwise: a file's own header
# wins, and a file whose header has only a copyright line or only a licence
# tag takes the missing half from the block that matches it. When several
# blocks match one file, the LAST one applies, so the catch-all comes first.
version = 1

# --- The distribution: BSD-3-Clause (LICENSE) -----------------------------------
# Everything not claimed by a later block: configuration.nix, flake.nix, the
# modules without a licence of their own (including ArchibaldOS, plymouth,
# demod-ip-blocker and scrollmapper, which carry BSD-3-Clause LICENSE files),
# home/, tests/, vm-manager/, installer/, docs, scripts, CI, flake.lock files
# (written by `nix flake lock`, never edited) and the media in assets/ that
# DeMoD LLC made. home/README.md keeps the copyright line written in it.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# --- Sub-flakes under MIT --------------------------------------------------------
# Each has its own LICENSE file and declares MIT in Cargo.toml and/or flake.nix.
[[annotations]]
path = [
  "modules/blipply-assistant/**",
  "modules/demod-voice/**",
  "modules/dsp-ctl/**",
  "modules/greeting/**",
  "modules/mcp-servers/**",
  "modules/oligarchy-forge/**",
  "modules/warroom/**",
]
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "MIT"

# Reliquary arrived as a vendored tarball whose LICENSE names "Reliquary
# contributors"; that notice is kept as written (see CLAUDE.md, reliquary).
[[annotations]]
path = "modules/reliquary/**"
SPDX-FileCopyrightText = "2026 Reliquary contributors"
SPDX-License-Identifier = "MIT"

# --- Sub-flakes under MPL-2.0 ----------------------------------------------------
# Declared MPL-2.0 in their Cargo.toml files; LICENSE holds the text.
[[annotations]]
path = ["modules/oligarchy-p2p/**", "modules/oligarchy-plugins/**"]
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "MPL-2.0"

# --- LGPL-3.0-only: DCF code from HydraMesh (DeMoD LLC) -------------------------
# demod-talk packages HydraMesh's Lua DCF stack; the Kotlin dcf/ package in the
# hypr-controller app is a copy of HydraMesh's Kotlin codec.
[[annotations]]
path = [
  "modules/demod-talk/**",
  "modules/hypr-controller/android/app/src/main/kotlin/dcf/**",
]
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "LGPL-3.0-only"

# --- Outside contribution -----------------------------------------------------------
# Leonardo Groos Lago's commit 1611c56 (Chaotic-Nyx CachyOS kernels) rewrote
# modules/kernel.nix; 53 of its lines survive at the time of writing. His six
# lines of input wiring in flake.nix are not separately noted.
[[annotations]]
path = "modules/kernel.nix"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2025-2026 DeMoD LLC", "2026 Leonardo Groos Lago"]
SPDX-License-Identifier = "BSD-3-Clause"

# --- installer/: vendored byte-identically from ArchibaldOS --------------------
# Three steps of the distroinstall job follow the upstream `nixos` job of
# calamares-nixos-extensions closely (the BIOS + GRUB-cryptodisk keyfile, the
# pkexec chmod step and the nixos-install progress loop). That job lives in
# nixpkgs (pkgs/by-name/ca/calamares-nixos-extensions/src/modules/nixos/main.py)
# and is MIT under nixpkgs' COPYING. ArchibaldOS's REUSE.toml says the same.
[[annotations]]
path = "installer/calamares/distroinstall/main.py"
precedence = "aggregate"
SPDX-FileCopyrightText = "2003-2026 Eelco Dolstra and the Nixpkgs/NixOS contributors"
SPDX-License-Identifier = "MIT"

# --- modules/terminal/patches: changes to Velocitty (MIT) --------------------
# Shaped as upstream pull requests to github.com/valvesky/velocitty; the
# context lines they quote are Velocitty's own MIT-licensed code.
[[annotations]]
path = "modules/terminal/patches/*.patch"
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "MIT"

# --- Media with third-party parts ---------------------------------------------------
# The OLIGARCHY wallpapers are DeMoD LLC's art around the NixOS snowflake, which
# is CC-BY 4.0 (designed by Simon Frankau, revised by Tim Cuthbertson;
# https://github.com/NixOS/nixos-artwork/tree/master/logo).
[[annotations]]
path = ["assets/wallpaper.jpg", "assets/wallpaper-color.jpg", "assets/wallpaperalt.jpg"]
SPDX-FileCopyrightText = ["2025-2026 DeMoD LLC", "Simon Frankau, Tim Cuthbertson (NixOS logo)"]
SPDX-License-Identifier = "BSD-3-Clause AND CC-BY-4.0"

# assets/1766653327186.jpg (the Oligarchy-lite mascot) was generated by DeMoD
# with a Google AI image tool; it carries Google's SynthID watermark. It is
# covered by the catch-all above; noted here so its origin is on record.

# --- Scripture text: public domain ---------------------------------------------
# Verses from the KJVA in the Scrollmapper bible_databases dump. The module's
# LICENSE excludes scripture text from its BSD-3-Clause grant.
[[annotations]]
path = ["modules/scrollmapper/sample.tsv", "modules/scrollmapper/boot-pool.tsv"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-Public-Domain"

# --- Text that quotes licence identifiers ---------------------------------------
# This roadmap discusses kernel licences ("GPL-2.0-only", "LGPL", ...) in prose;
# REUSE would read those as the file's own tags.
[[annotations]]
path = "docs/exsecutor-kernel-roadmap.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "BSD-3-Clause"
