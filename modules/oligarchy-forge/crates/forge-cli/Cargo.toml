[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "oligarchy-forge — sandboxed coding-agent runner (build/run/shell)"

[[bin]]
name = "oligarchy-forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
