[package]
name = "reliquary"
version = "0.1.0"
edition = "2021"
description = "Multi-medium data preservation: tarball + checksum + PAR2 across USB mirrors and CD-R"
license = "MIT"
default-run = "reliquary"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"
hex = "0.4"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
walkdir = "2"

[[bin]]
name = "reliquary"
path = "src/main.rs"
