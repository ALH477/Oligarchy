[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliquary"
version = "0.1.0"
description = "Multi-medium data preservation: tarball + checksum + PAR2 across USB mirrors and CD-R"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reliquary" }]
dependencies = [
  "textual>=0.80.0",
  "pydantic>=2.0",
  "rich>=13.0",
]

[project.scripts]
reliquary = "reliquary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
