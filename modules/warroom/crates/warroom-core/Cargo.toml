[package]
name = "warroom-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Data layer for the Oligarchy War Room: collectors, palette, subprocess exec. No TUI dependency."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
wait-timeout = "0.2"
