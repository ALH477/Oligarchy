[package]
name = "warroom-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oligarchy War Room — unified Ratatui command center"

[[bin]]
name = "warroom"
path = "src/main.rs"

[dependencies]
warroom-core = { path = "../warroom-core" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
